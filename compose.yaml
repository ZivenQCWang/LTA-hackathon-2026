services:
  pliz:
    build: .
    image: pliz:local
    restart: unless-stopped
    env_file: deploy/private/production.env
    ports:
      - "127.0.0.1:8016:8000"
    volumes:
      - pliz-data:/app/storage
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pliz-data:
